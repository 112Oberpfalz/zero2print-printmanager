{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Druckjob bearbeiten</h1>
        <p class="muted">DJ-{{ "%04d"|format(job.id) }}</p>
    </div>
</div>

<div class="form-card">
    <form method="post" action="/jobs/{{ job.id }}/edit">
        <div class="form-group">
            <label for="project_id">Projekt *</label>
            <select id="project_id" name="project_id" required>
                {% for project in projects %}
                <option value="{{ project.id }}" {% if job.project_id == project.id %}selected{% endif %}>
                    {{ project.customer.name }} — {{ project.name }}
                </option>
                {% endfor %}
            </select>
            <p class="muted small">
                Hinweis: Die Dateiauswahl zeigt aktuell die Dateien des bisherigen Projekts.
            </p>
        </div>

        <div class="form-group">
            <label for="file_id">Datei</label>
            <select id="file_id" name="file_id">
                <option value="0">Keine Datei auswählen</option>
                {% for file in project_files %}
                <option value="{{ file.id }}" {% if job.file_id == file.id %}selected{% endif %}>
                    {{ file.original_filename }}{% if file.version %} — {{ file.version }}{% endif %}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="printer_name">Drucker</label>
            <select id="printer_name" name="printer_name">
                <option value="">Bitte wählen</option>

                {% for printer in printer_presets %}
                <option value="{{ printer }}" {% if job.printer_name == printer %}selected{% endif %}>
                    {{ printer }}
                </option>
                {% endfor %}

                {% if job.printer_name and job.printer_name not in printer_presets %}
                <option value="{{ job.printer_name }}" selected>
                    {{ job.printer_name }}
                </option>
                {% endif %}
            </select>
        </div>

        <div class="form-group">
            <label for="material">Material</label>
            <select id="material" name="material">
                {% for material in material_presets %}
                <option value="{{ material }}" {% if job.material == material or not job.material and material == "PLA+" %}selected{% endif %}>
                    {{ material }}
                </option>
                {% endfor %}

                {% if job.material and job.material not in material_presets %}
                <option value="{{ job.material }}" selected>
                    {{ job.material }}
                </option>
                {% endif %}
            </select>
        </div>

        <div class="form-group">
            <label for="color">Farbe</label>
            <input type="text" id="color" name="color" value="{{ job.color or '' }}" placeholder="z. B. Schwarz, Weiß, Blau, Rot">
        </div>

        <div class="form-group">
            <label for="planned_print_time">Geplante Druckzeit</label>
            <input type="text" id="planned_print_time" name="planned_print_time" value="{{ job.planned_print_time or '' }}">
        </div>

        <div class="form-group">
            <label for="planned_weight_grams">Geplantes Filamentgewicht in Gramm</label>
            <input type="number" id="planned_weight_grams" name="planned_weight_grams" min="0" step="1" value="{{ job.planned_weight_grams or '' }}">
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                {% for status in statuses %}
                <option value="{{ status }}" {% if job.status == status %}selected{% endif %}>
                    {{ status }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Notizen</label>
            <textarea id="notes" name="notes" rows="5">{{ job.notes or '' }}</textarea>
        </div>

        <div class="form-actions">
            <a class="btn-secondary" href="/jobs/{{ job.id }}">Abbrechen</a>
            <button class="btn" type="submit">Änderungen speichern</button>
        </div>
    </form>
</div>
{% endblock %}
