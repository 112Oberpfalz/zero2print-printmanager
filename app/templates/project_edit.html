{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Projekt bearbeiten</h1>
        <p class="muted">{{ project.name }}</p>
    </div>
</div>

<div class="form-card">
    <form method="post" action="/projects/{{ project.id }}/edit">
        <div class="form-group">
            <label for="customer_id">Kunde *</label>
            <select id="customer_id" name="customer_id" required>
                {% for customer in customers %}
                <option value="{{ customer.id }}" {% if project.customer_id == customer.id %}selected{% endif %}>
                    {{ customer.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="name">Projektname *</label>
            <input type="text" id="name" name="name" value="{{ project.name }}" required autofocus>
        </div>

        <div class="form-group">
            <label for="description">Beschreibung</label>
            <textarea id="description" name="description" rows="4">{{ project.description or '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                {% for status in statuses %}
                <option value="{{ status }}" {% if project.status == status %}selected{% endif %}>
                    {{ status }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="deadline">Deadline</label>
            <input type="date" id="deadline" name="deadline" value="{{ project.deadline or '' }}">
        </div>

        <div class="form-group">
            <label for="note">Notiz</label>
            <textarea id="note" name="note" rows="4">{{ project.note or '' }}</textarea>
        </div>

        <div class="form-actions">
            <a class="btn-secondary" href="/projects/{{ project.id }}">Abbrechen</a>
            <button class="btn" type="submit">Änderungen speichern</button>
        </div>
    </form>
</div>
{% endblock %}
